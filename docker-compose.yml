# Sobe a infraestrutura local. Na Fase 1, apenas o PostgreSQL.
# Uso:  docker compose up -d      (sobe em segundo plano)
#       docker compose ps         (mostra o status)
#       docker compose down       (para; os dados continuam no volume)
#       docker compose down -v    (para E apaga os dados — cuidado)
services:
  db:
    image: postgres:16-alpine
    container_name: transparencia-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transparencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transparencia}
      POSTGRES_DB: ${POSTGRES_DB:-transparencia}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transparencia} -d ${POSTGRES_DB:-transparencia}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
