[project]
name = "monitor-transparencia"
version = "0.1.0"
description = "Plataforma de monitoramento contínuo da conformidade de portais públicos de transparência"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Banco de dados
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Configuração e validação
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Linha de comando
    "typer>=0.15",
    "rich>=13.9",
    # Leitura do checklist original (.xlsx)
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
# Depois de `uv sync`, o comando `uv run transparencia --help` fica disponível.
transparencia = "transparencia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transparencia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # permite acentos/aspas tipográficas do português

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testes que precisam de um PostgreSQL rodando (DATABASE_URL)",
]
