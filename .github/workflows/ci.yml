# Integração contínua: a cada push/PR, o GitHub roda lint + testes
# (inclusive contra um PostgreSQL 16 de verdade, criado só para o teste).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transparencia
          POSTGRES_PASSWORD: transparencia
          POSTGRES_DB: transparencia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U transparencia"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://transparencia:transparencia@localhost:5432/transparencia_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Testes
        run: uv run pytest -v
