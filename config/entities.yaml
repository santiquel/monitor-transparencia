# Cadastro de entidades avaliadas (entrada do sistema).
#
# Campos:
#   slug        identificador estável, usado em URLs da API (minúsculas e hífens)
#   poder/esfera  definem o TIPO da entidade -> decide quais critérios se aplicam
#   url_site    site oficial (obrigatório)
#   url_portal  Portal da Transparência; se ausente, o coletor tenta DESCOBRIR
#               a partir do site (links com "transparência" no texto)
#
# Reconhecimento feito em 11/10/2026 (ver docs/03_reconhecimento_portais.md).
entidades:
  - slug: rio-de-janeiro
    nome: Prefeitura da Cidade do Rio de Janeiro
    municipio: Rio de Janeiro
    uf: RJ
    codigo_ibge: "3304557"
    poder: executivo
    esfera: municipal
    url_site: https://prefeitura.rio/
    url_portal: https://transparencia.prefeitura.rio/
    notas: Site em WordPress; dados abertos em data.rio.

  - slug: duque-de-caxias
