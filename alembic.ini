# Configuração do Alembic (ferramenta de migrations do banco).
# A URL do banco NÃO fica aqui: é lida do .env em migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = src
# Separa caminhos pelo separador do sistema (";" no Windows), não por espaços.
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
